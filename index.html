<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد موسى | مطور تطبيقات</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Iconify -->
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== TOP ACCENT BAR ===== -->
    <div class="top-accent-bar"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="max-w-[1200px] mx-auto px-6 h-14 flex items-center justify-between">
            <a href="#hero" class="font-black text-base tracking-tight" style="color:var(--fg);" id="navLogo">م</a>
            <div class="hidden md:flex items-center gap-8" id="navLinks"></div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" id="themeBtn" class="w-8 h-8 flex items-center justify-center" style="color:var(--fg-sec);" aria-label="Toggle theme">
                    <span class="iconify" data-icon="mdi:weather-sunny" data-width="16" id="themeIcon"></span>
                </button>
                <button onclick="toggleLang()" id="langBtn" class="text-[10px] font-bold tracking-widest" style="color:var(--fg-sec); border: 1px solid var(--border); padding: 0.25rem 0.6rem;">EN</button>
                <button onclick="toggleMobileMenu()" class="md:hidden w-8 h-8 flex flex-col items-end justify-center gap-1.5" id="menuBtn" aria-label="Menu">
                    <span class="block w-5 h-[1.5px] transition-all duration-300" style="background:var(--fg);" id="ml1"></span>
                    <span class="block w-3.5 h-[1.5px] transition-all duration-300" style="background:var(--fg);" id="ml2"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ===== MOBILE MENU ===== -->
    <div class="mobile-menu" id="mobileMenu">
        <div id="mobileNavLinks"></div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="mainContent"></main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer" class="border-t" style="border-color:var(--border);"></footer>

    <!-- ===== BACK TO TOP ===== -->
    <button id="backToTop" aria-label="Back to top">
        <span class="iconify" data-icon="mdi:arrow-up" data-width="16"></span>
    </button>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
